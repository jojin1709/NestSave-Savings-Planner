AutoName: NestSave
Summary: Private, 100% offline-first savings goal planner with zero cloud tracking.
Description: |-
  NestSave is a deterministic, 100% offline-first personal savings planner and wealth
  roadmap engine designed for maximum privacy and zero cloud dependence.

  Key Features:
  * 100% Offline-first with local Room SQLite storage.
  * Hardware Biometric Vault Lock (fingerprint & face unlock).
  * Indian Bank Recurring Deposit (RD) quarterly compounding & FD calculations.
  * 1-Click Plan Recalibration for behind-schedule goals.
  * Salary-Day batch deposits and priority weighting.
  * Zero ads, zero telemetry, zero cloud tracking.

